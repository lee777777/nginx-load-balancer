#docker compose up -d --scale app=5
worker_processes 1; #how many parallel processes nginx spawns to handle client requiests - usually the number is equal to number of cpu cores in the server

events {
    worker_connections 1024; #per worker process: how many simultaneos connections can be opened , default= 512
}

http { # http traffic - how to handle http requests
# Create a 10MB memory zone 'req_limit_zone' allowing 5 requests per second per IP
    limit_req_zone $binary_remote_addr zone=req_limit_zone:10m rate=5r/s; #`binary_remote_addr` Holds the IP address of the client making the request, 
    include mime.types; #include mime.types; tells NGINX to load a separate file named mime.types that contains a dictionary mapping file extensions (like .html, .css, .js, .png) to their official MIME types (like text/html, text/css, application/javascript, image/png).
    gzip on; #compresses text-based responses before sending them over the network, reducing payload sizes and speeding up load times.
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000; # Only compress responses larger than 1KB

    # Tell NGINX to use Docker's internal DNS server, it Tells NGINX to re-query Docker's DNS every 10 seconds to resolve the scaled 'app' containers.
    resolver 127.0.0.11 valid=10s;

    # Upstream block to define the Node.js backend servers for load balancing, "nodeja_cluster" is a custom name
    upstream nodejs_cluster {  # stream = TCP and UDP traffic
    # max_fails: number of failed attempts before considering server down
    # fail_timeout: how long the server is considered unavailable
        server app:3000 max_fails=3 fail_timeout=10s;
        
    }

    server {
        listen 443 ssl;  # Listen on port 443 for HTTPS
        server_name localhost;

        # Reads from the container mount target (/etc/nginx/certs)
        ssl_certificate /etc/nginx/certs/nginx-selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/nginx-selfsigned.key;

        # Proxying requests 
        location / {
            # rate limit with a burst buffer of 10 requests (e.g., loading multiple page assets).
            limit_req zone=req_limit_zone burst=10 nodelay;
            # Pass incoming requests to the upstream pool named nodejs_cluster
            proxy_pass http://nodejs_cluster;
            proxy_set_header Host $host; #Passes the original domain name/hostname requested by the client along to the Node.js backend.
            proxy_set_header X-Real-IP $remote_addr; #Sends the actual client's IP address to Node.js. Without this, the Express/Node logs would show NGINX's internal container IP as the visitor for every request.
        }
    }

    # Optional server block for HTTP to HTTPS redirection
    server {
        listen 80;  # Listen on port 80 for HTTP
        server_name localhost;

        # Redirect all HTTP requests to HTTPS on host port 8443
        location / {
            return 301 https://$host:8443$request_uri;
        }
    }
}
# 1 MB holds about 16,000 IP addresses, so 10 MB allows NGINX to track around 160,000 distinct IP addresses simultaneously for rate limiting.